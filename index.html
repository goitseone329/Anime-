<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Watching Anime - AnimeZone</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <div class="logo">Anime<span>Zone</span></div>
        <nav>
            <a href="#" class="active">Home</a>
            <a href="#">Movies</a>
            <a href="#">Series</a>
        </nav>
    </header>

    <!-- Top Banner Ad Space -->
    <div class="ad-placeholder banner-ad">
        <p>Target Banner Ad Space (728x90)</p>
    </div>

    <main class="container">
        <div class="main-layout-grid">
            
            <!-- Video Player Display Box -->
            <section class="player-section">
                <div class="video-container-box">
                    <div style="width:100%; height:100%; display:flex; align-items:center; justify-content:center; background:#111; color:#ff9900; font-weight:bold; position:absolute; top:0; left:0; border-radius:8px;">
                        <span id="player-status">▶ Waiting for Stream Link...</span>
                    </div>
                </div>
                
                <!-- Interactive Title and Dropdown Menu -->
                <h2 class="video-title" id="current-episode-title">Now Playing: Episode 1</h2>
                
                <div class="selector-container">
                    <label for="episode-select" style="color: #aaa; font-weight: bold; margin-right: 10px;">Choose Episode:</label>
                    <select id="episode-select" class="episode-dropdown">
                        <option value="1">Episode 01 - The Journey Begins</option>
                        <option value="2">Episode 02 - New Powers Awaken</option>
                        <option value="3">Episode 03 - The Shadow Rival</option>
                        <option value="4">Episode 04 - Alliance Formed</option>
                    </select>
                </div>

                <p class="video-description">You are viewing the video streaming interface template layout. Real stream links can be attached here.</p>
            </section>

            <!-- Sidebar Ad Space -->
            <aside class="sidebar-ad-section">
                <div class="ad-placeholder sidebar-ad">
                    <p>Sidebar Ad Space (300x250)</p>
                </div>
            </aside>

        </div>
    </main>

    <!-- Simple JavaScript to Change Episode Title Instantly -->
    <script>
        const episodeSelect = document.getElementById('episode-select');
        const currentTitle = document.getElementById('current-episode-title');
        const playerStatus = document.getElementById('player-status');

        episodeSelect.addEventListener('change', function() {
            const selectedNum = episodeSelect.value;
            const selectedText = episodeSelect.options[episodeSelect.selectedIndex].text;
            
            // Instantly update the text on screen
            currentTitle.textContent = "Now Playing: " + selectedText;
            playerStatus.textContent = "▶ Loading " + selectedText + "...";
        });
    </script>

</body>
</html>
