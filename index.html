<!-- AnimeHeaven Style Episode Grid Panel Layout -->
<div class="episode-panel-container">
    <h3 style="color: #ccc; font-size: 16px; margin-bottom: 12px;">Episodes:</h3>
    <div class="episode-row-grid">
        
        <!-- Episode 5 Block Card -->
        <div class="ep-block-card" onclick="changeEpisode('5', 'Episode 05 - Ultimate Battle')">
            <span class="ep-num">5</span>
            <span class="ep-time-ago">2 h ago</span>
        </div>
        
        <!-- Episode 4 Block Card -->
        <div class="ep-block-card" onclick="changeEpisode('4', 'Episode 04 - Alliance Formed')">
            <span class="ep-num">4</span>
            <span class="ep-time-ago">5 d ago</span>
        </div>
        
        <!-- Episode 3 Block Card -->
        <div class="ep-block-card" onclick="changeEpisode('3', 'Episode 03 - The Shadow Rival')">
            <span class="ep-num">3</span>
            <span class="ep-time-ago">5 d ago</span>
        </div>
        
        <!-- Episode 2 Block Card -->
        <div class="ep-block-card" onclick="changeEpisode('2', 'Episode 02 - New Powers Awaken')">
            <span class="ep-num">2</span>
            <span class="ep-time-ago">5 d ago</span>
        </div>
        
        <!-- Episode 1 Block Card -->
        <div class="ep-block-card active" onclick="changeEpisode('1', 'Episode 01 - The Journey Begins')">
            <span class="ep-num">1</span>
            <span class="ep-time-ago">5 d ago</span>
        </div>

    </div>
</div>
