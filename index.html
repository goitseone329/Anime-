<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo-box" id="logoHomeBtn">ANIME</div>
        <input type="text" class="search-bar" id="searchEngineInput" placeholder="Search anime titles...">
    </header>

    <div class="container">
        <div class="section-title" id="gridTitleDisplay">Popular Anime</div>
        <div id="trending-anime-grid" class="anime-grid">
            <!-- Your cards will load here instantly with no player box blocking them -->
        </div>
    </div>

    <script>
        // Your clean internal database collection
        const ANIME_DATABASE = [
            { mal_id: 20, title: "Naruto", type: "TV", episodes: 220, score: "7.99", icon: "🍥" },
            { mal_id: 1735, title: "Naruto: Shippuden", type: "TV", episodes: 500, score: "8.26", icon: "⚡" },
            { mal_id: 21, title: "One Piece", type: "TV", episodes: 1100, score: "8.75", icon: "☠️" },
            { mal_id: 30276, title: "One Punch Man", type: "TV", episodes: 12, score: "8.51", icon: "👊" },
            { mal_id: 38000, title: "Demon Slayer", type: "TV", episodes: 26, score: "8.49", icon: "⚔️" },
            { mal_id: 5114, title: "Fullmetal Alchemist: B", type: "TV", episodes: 64, score: "9.10", icon: "🦾" },
            { mal_id: 1535, title: "Death Note", type: "TV", episodes: 37, score: "8.62", icon: "📓" },
            { mal_id: 16498, title: "Attack on Titan", type: "TV", episodes: 25, score: "8.54", icon: "🧱" },
            { mal_id: 44511, title: "Chainsaw Man", type: "TV", episodes: 12, score: "8.57", icon: "🪚" },
            { mal_id: 51009, title: "Jujutsu Kaisen Season 2", type: "TV", episodes: 23, score: "8.82", icon: "👁️" }
        ];

        const gridContainer = document.getElementById("trending-anime-grid");
        const gridTitleDisplay = document.getElementById("gridTitleDisplay");
        const searchInput = document.getElementById("searchEngineInput");
        const logoHomeBtn = document.getElementById("logoHomeBtn");

        function renderGrid(animeList, headingText) {
            gridTitleDisplay.textContent = headingText;
            gridContainer.innerHTML = "";

            if (animeList.length === 0) {
                gridContainer.innerHTML = '<div class="loading-text">No matches found.</div>';
                return;
            }

            animeList.forEach(anime => {
                const card = document.createElement("div");
                card.className = "anime-card";
                
                card.innerHTML = `
                    <div class="card-image-wrapper">
                        <span>${anime.icon}</span>
                    </div>
                    <div class="card-details">
                        <span class="banner-title">${anime.type} (${anime.episodes})</span>
                        <h3>${anime.title}</h3>
                        <div class="rating">⭐ ${anime.score}</div>
                    </div>
                `;
                
                // Routes seamlessly to watch.html when tapped
                card.addEventListener("click", () => {
                    window.location.href = `watch.html?id=${anime.mal_id}&title=${encodeURIComponent(anime.title)}&eps=${anime.episodes}`;
                });

                gridContainer.appendChild(card);
            });
        }

        function initApp() {
            searchInput.value = "";
            renderGrid(ANIME_DATABASE, "Popular Anime");
        }

        searchInput.addEventListener("input", (e) => {
            const query = e.target.value.trim().toLowerCase();
            if (!query) {
                renderGrid(ANIME_DATABASE, "Popular Anime");
                return;
            }
            const filtered = ANIME_DATABASE.filter(anime => anime.title.toLowerCase().includes(query));
            renderGrid(filtered, `Search Results for: "${e.target.value}"`);
        });

        logoHomeBtn.addEventListener("click", initApp);
        window.addEventListener("DOMContentLoaded", initApp);
    </script>
</body>
</html>
