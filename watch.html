<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anime Heaven - Watch</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <!-- Clicking the logo returns the beginner client smoothly back to the homepage grid -->
        <div class="logo-box" onclick="window.location.href='index.html'">ANIME</div>
    </header>

    <div class="player-container">
        <div class="player-wrapper">
            <div id="placeholder-screen" class="player-placeholder" style="display: none;">
                <p>No media stream targeting currently loaded.</p>
            </div>
            <iframe id="video-embed-frame" allowfullscreen></iframe>
        </div>
        
        <div class="player-details">
            <h2 id="statusMsg">Loading Title Details...</h2>
            <p id="subMsg">Streaming Client: Connecting to Frame Resolver...</p>
            
            <!-- Dynamic Episode Selector Hub Module Component -->
            <div class="episode-control-panel" id="episodeControlPanel" style="display: block;">
                <div class="episode-panel-title">Select Episode</div>
                <div class="episode-grid" id="episodeButtonGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const videoEmbedFrame = document.getElementById("video-embed-frame");
        const episodeButtonGrid = document.getElementById("episodeButtonGrid");
        const statusMsg = document.getElementById("statusMsg");
        const subMsg = document.getElementById("subMsg");

        // Open-source embedding provider routing mechanism 
        function buildStreamingEmbedLink(malId, episodeNum) {
            return `https://vidsrc.to{malId}/${episodeNum}`;
        }

        // Active execution routine to trigger the media panel elements
        function mountPlayerStream(malId, titleName, episodeNum) {
            videoEmbedFrame.src = buildStreamingEmbedLink(malId, episodeNum);
            statusMsg.textContent = `Playing: ${titleName}`;
            subMsg.textContent = `Streaming Client: Active (Episode ${episodeNum})`;

            // Toggle active highlighting state classes layout across target elements
            document.querySelectorAll(".episode-btn").forEach(btn => {
                btn.classList.remove("active");
                if (parseInt(btn.getAttribute("data-ep")) === episodeNum) {
                    btn.classList.add("active");
                }
            });
        }

        // Framework initial engine extraction setup on window ready
        window.addEventListener("DOMContentLoaded", () => {
            // Read incoming parameter strings out of the browser address link frame
            const urlParameters = new URLSearchParams(window.location.search);
            const animeId = urlParameters.get("id");
            const animeTitle = urlParameters.get("title") || "Unknown Anime";
            const totalEpisodes = parseInt(urlParameters.get("eps")) || 12;

            if (!animeId) {
                statusMsg.textContent = "Error: No Anime Configuration Targeted";
                subMsg.textContent = "Please return to the homepage and select an item.";
                return;
            }

            // Assemble the clickable button grid elements dynamically inside DOM components
            episodeButtonGrid.innerHTML = "";
            for (let i = 1; i <= totalEpisodes; i++) {
                const epBtn = document.createElement("button");
                epBtn.className = "episode-btn";
                epBtn.textContent = i;
                epBtn.setAttribute("data-ep", i);
                
                epBtn.addEventListener("click", () => {
                    mountPlayerStream(animeId, animeTitle, i);
                });

                episodeButtonGrid.appendChild(epBtn);
            }

            // Auto-launch the player engine targeting Episode 1 upon initial configuration entry load
            mountPlayerStream(animeId, animeTitle, 1);
        });
    </script>
</body>
</html>
